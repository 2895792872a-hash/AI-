services:
  # ── Backend API ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - VL_API_KEY=${VL_API_KEY}
      - VL_MODEL=${VL_MODEL:-qwen-vl-max}
      - BROWSER_HEADLESS=true
      - BROWSER_TIMEOUT_MS=30000
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
    volumes:
      - browser_profile:/app/browser_profile
      - chat_data:/app/chat_data
      - ./memory.json:/app/memory.json
    restart: unless-stopped

  # ── Frontend (Nginx) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  browser_profile:
  chat_data:
